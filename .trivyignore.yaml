# Advisories the security gate accepts for now. Every entry names why it cannot
# be fixed from this repository today and expires, so the gate fails again and
# the decision is taken afresh rather than forgotten. Add an entry only with a
# reason, an expiry of 30 days or less, and the package it applies to (so
# the same advisory in another package still fails); see .standards/security.md.
vulnerabilities:
  # sharp: pulled in by @huggingface/transformers 3.x; fixed only through
  # transformers 4.3, a major the embedding adapter has not adopted yet.
  - id: GHSA-f88m-g3jw-g9cj
    statement: sharp fix arrives with @huggingface/transformers 4, not yet adopted by the embedding adapter
    purls: ["pkg:npm/sharp"]
    expired_at: 2026-10-25
  - id: GHSA-rgj7-g3m4-5g8c
    statement: sharp fix arrives with @huggingface/transformers 4, not yet adopted by the embedding adapter
    purls: ["pkg:npm/sharp"]
    expired_at: 2026-10-25
  # basic-ftp: pulled in by agent-browser (an optional peer of @routecraft/os)
  # through webdriverio, @puppeteer/browsers, proxy-agent, pac-proxy-agent and
  # get-uri. Every get-uri release, 8.0.1 included, requires basic-ftp ^5, and
  # the fix exists only in basic-ftp 6.
  - id: CVE-2026-102990
    statement: basic-ftp fix is only in 6.x; every get-uri release still requires ^5, reached through agent-browser's webdriverio chain
    purls: ["pkg:npm/basic-ftp"]
    expired_at: 2026-11-02
