# Local production check. Run from the repository root:
#   docker compose -f apps/routecraft.dev/compose.yaml up --build
#
# WITHOUT A FREEZE THIS IS NOT A RELEASE BUILD. /docs publishes main, exactly
# like /docs/next, so unreleased pages appear on the released channel and the
# version reads "vdev". The build says so in its output. To reproduce a real
# deploy, freeze first and restore afterwards:
#
#   bun apps/routecraft.dev/scripts/freeze-docs.ts v0.6.0
#   VITE_DOC_VERSION=v0.6.0 docker compose -f apps/routecraft.dev/compose.yaml up --build
#   bun apps/routecraft.dev/scripts/freeze-docs.ts --restore
services:
  app:
    build:
      context: ../..
      dockerfile: apps/routecraft.dev/Dockerfile
      args:
        VITE_DOC_VERSION: ${VITE_DOC_VERSION:-dev}
    ports:
      - '${PORT:-3000}:3000'
    restart: unless-stopped
