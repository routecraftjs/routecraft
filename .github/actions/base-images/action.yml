name: Restore base images
description: >-
  Loads the images a job builds from or pulls out of the Actions cache, and
  pulls them from a registry only when the cache has no copy. A steady
  run never contacts a registry. Docker Hub's anonymous pull quota is
  shared by every repository on a runner's address, so a miss is served
  from Google's pull-through mirror of Docker Hub first, from AWS public
  ECR for a Docker official image next, and from Docker Hub itself last,
  with retries, with the Docker Hub credentials when the workflow passes
  them and anonymously otherwise.
inputs:
  images:
    description: Image references to restore, one per line.
    default: ""
  dockerfiles:
    description: >-
      Dockerfiles whose FROM lines name the images to restore, one per
      line. A stage alias or a reference built from a build argument is
      skipped.
    default: ""
  dockerhub-username:
    description: Docker Hub username for a pull on a cache miss; optional.
    default: ""
  dockerhub-token:
    description: Docker Hub access token for a pull on a cache miss; optional.
    default: ""
runs:
  using: composite
  steps:
    - id: list
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        DOCKERFILES: ${{ inputs.dockerfiles }}
      run: |
        set -euo pipefail
        {
          printf '%s\n' "$IMAGES"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            awk 'toupper($1) == "FROM" {
              if (toupper($3) == "AS") names[$4] = 1
              if (!($2 in names) && index($2, "$") == 0) print $2
            }' "$file"
          done <<< "$DOCKERFILES"
        } | sed '/^[[:space:]]*$/d' | sort -u > "$RUNNER_TEMP/base-images.txt"
        if [ ! -s "$RUNNER_TEMP/base-images.txt" ]; then
          echo "::error::No image to restore: pass images or dockerfiles."
          exit 1
        fi
        echo "images=$(paste -sd' ' "$RUNNER_TEMP/base-images.txt")" >> "$GITHUB_OUTPUT"
        echo "key=base-images-$(sha256sum "$RUNNER_TEMP/base-images.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # An exact key only: the archive is the images of this job and nothing
    # else, so a partial hit would restore another job's set.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/base-images
        key: ${{ steps.list.outputs.key }}

    - id: load
      shell: bash
      env:
        IMAGES: ${{ steps.list.outputs.images }}
        DOCKERHUB_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKERHUB_TOKEN: ${{ inputs.dockerhub-token }}
      run: |
        set -euo pipefail
        mkdir -p ~/.cache/base-images
        logged_in=false
        pulled=false
        # Google's pull-through mirror of Docker Hub fetches with its own
        # credentials, so it carries none of the anonymous quota a runner
        # address shares with every other repository; AWS public ECR mirrors
        # the Docker official images (one path segment). Docker Hub itself is
        # the last resort, with retries, because the seed may run on an
        # address other repositories have spent.
        mirrors_of() {
          case "$1" in
            */*) printf 'mirror.gcr.io/%s\\n' "$1" ;;
            *) printf 'mirror.gcr.io/library/%s\\npublic.ecr.aws/docker/library/%s\\n' "$1" "$1" ;;
          esac
        }
        pull_direct() {
          local attempt
          if [ -n "$DOCKERHUB_TOKEN" ] && [ "$logged_in" = false ]; then
            printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            logged_in=true
          fi
          for attempt in 1 2 3 4 5; do
            if docker pull "$1"; then return 0; fi
            echo "pull of $1 failed (attempt $attempt of 5); waiting $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          return 1
        }
        for image in $IMAGES; do
          tar=~/.cache/base-images/$(printf '%s' "$image" | tr '/:@' '___').tar
          if [ -f "$tar" ]; then
            docker load -i "$tar"
            continue
          fi
          fetched=false
          for mirror in $(mirrors_of "$image"); do
            if docker pull "$mirror"; then
              docker tag "$mirror" "$image"
              fetched=true
              break
            fi
            echo "mirror $mirror has no copy of $image; trying the next source"
          done
          if [ "$fetched" = false ]; then
            pull_direct "$image"
          fi
          docker save -o "$tar" "$image"
          pulled=true
        done
        echo "pulled=$pulled" >> "$GITHUB_OUTPUT"

    - if: steps.load.outputs.pulled == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/base-images
        key: ${{ steps.list.outputs.key }}
