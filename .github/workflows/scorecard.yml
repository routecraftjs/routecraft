name: Scorecard

# OpenSSF Scorecard grades the repository's supply-chain practices (pinned
# dependencies, token permissions, branch protection, signed releases and so
# on) and publishes the result, so a security team evaluating Routecraft can
# read it rather than ask. Findings land in code scanning.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results and fetch a Sigstore signing certificate for them.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
