name: Security rescan

# A release is scanned when it is built, but CVEs are published afterwards.
# This rescans what users run today (the latest published packages, scaffolded
# the way `create-routecraft` scaffolds them, and the live docs-site image)
# against the current vulnerability database. A fixable HIGH or CRITICAL
# finding opens one tracking issue, which the first clean run closes. The pull-request gate lives
# in ci.yml; the rules are in .standards/security.md.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the live site image from GHCR.
      packages: read
      # Open or update the tracking issue.
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the reference projects from the published packages
        run: |
          bun .github/scripts/security-reference-project.ts starter "$RUNNER_TEMP/ref-starter" --from-npm
          bun .github/scripts/security-reference-project.ts adapters "$RUNNER_TEMP/ref-adapters" --from-npm

      - name: Build the starter image
        run: docker build -t routecraft-starter:rescan "$RUNNER_TEMP/ref-starter"

      - name: Pull the live site image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          docker pull --platform linux/arm64 "ghcr.io/$OWNER/routecraft.dev:latest"
          docker tag "ghcr.io/$OWNER/routecraft.dev:latest" routecraft-site:rescan

      # Each scan records its verdict instead of stopping the job, so one
      # failure does not hide the others. A scanner error is not a finding: it
      # fails the run but never opens the tracking issue.
      - name: Scan
        id: scan
        run: |
          set -uo pipefail
          FAILED=""
          ERRORED=""
          mkdir -p "$RUNNER_TEMP/reports"
          VERDICTS="$RUNNER_TEMP/verdicts.md"
          : > "$VERDICTS"
          scan() {
            local label="$1"; shift
            local out="$RUNNER_TEMP/reports/$label.txt"
            .github/scripts/trivy.sh gate "$@" > "$out" 2>&1
            case "$?" in
              0) echo "- **$label**: clean" >> "$VERDICTS" ;;
              3) FAILED="$FAILED $label"
                 echo "- **$label**: fixable HIGH or CRITICAL findings" >> "$VERDICTS" ;;
              *) ERRORED="$ERRORED $label"
                 echo "- **$label**: the scan itself failed" >> "$VERDICTS" ;;
            esac
            { echo "### $label"; echo; echo '```'; cat "$out"; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"
          }
          scan starter-image image --scanners vuln,secret routecraft-starter:rescan
          scan adapters fs --scanners vuln /scan/ref-adapters/bun.lock
          scan site-image image --scanners vuln,secret routecraft-site:rescan
          echo "failed=${FAILED# }" >> "$GITHUB_OUTPUT"
          echo "errored=${ERRORED# }" >> "$GITHUB_OUTPUT"

      - name: Upload the scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-reports
          path: ${{ runner.temp }}/reports

      # The issue carries the verdicts and a link; the tables stay in the run,
      # since a few hundred detailed rows pass GitHub's issue body limit.
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.scan.outputs.failed }}
          ERRORED: ${{ steps.scan.outputs.errored }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          TITLE="Security rescan: fixable HIGH or CRITICAL findings in released artefacts"
          NUMBER="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
          if [ -z "$FAILED" ]; then
            # A scan that failed to run proves nothing, so the issue stays open.
            if [ -n "$NUMBER" ] && [ -z "$ERRORED" ]; then
              gh issue close "$NUMBER" --comment "The rescan is clean again: $RUN_URL"
            fi
            exit 0
          fi
          BODY="$RUNNER_TEMP/body.md"
          {
            echo "The scheduled rescan found fixable HIGH or CRITICAL vulnerabilities in: $FAILED."
            echo
            echo "Fix it, or record why it cannot be fixed yet in \`.trivyignore.yaml\` with an expiry (see \`.standards/security.md\` § 13). The findings are in the run's summary and its \`rescan-reports\` artifact: $RUN_URL"
            echo
            cat "$RUNNER_TEMP/verdicts.md"
          } > "$BODY"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$BODY"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi

      - name: Fail the run
        if: steps.scan.outputs.failed != '' || steps.scan.outputs.errored != ''
        env:
          FAILED: ${{ steps.scan.outputs.failed }}
          ERRORED: ${{ steps.scan.outputs.errored }}
        run: |
          [ -z "$FAILED" ] || echo "::error title=Security rescan::Fixable HIGH or CRITICAL findings in: $FAILED"
          [ -z "$ERRORED" ] || echo "::error title=Security rescan::The scan failed for: $ERRORED"
          exit 1
