name: Security rescan

# A release is scanned when it is built, but CVEs are published afterwards.
# This rescans what users run today (the latest published packages, scaffolded
# the way `create-routecraft` scaffolds them, and the live docs-site image)
# against the current vulnerability database. Findings go to code scanning
# and the run summary, never to the run's result: a scheduled run reports on
# main's head commit, and a CVE published after the merge is not a broken
# main. Only a scan that itself fails fails the run. The pull-request gate,
# which forces the fix, lives in ci.yml; the rules are in
# .standards/security.md.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  rescan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pull the live site image from GHCR.
      packages: read
      # Upload the SARIF to code scanning.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the reference projects from the published packages
        run: |
          bun .github/scripts/security-reference-project.ts starter "$RUNNER_TEMP/ref-starter" --from-npm
          bun .github/scripts/security-reference-project.ts adapters "$RUNNER_TEMP/ref-adapters" --from-npm

      - name: Build the starter image
        run: docker build -t routecraft-starter:rescan "$RUNNER_TEMP/ref-starter"

      - name: Pull the live site image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          docker pull --platform linux/arm64 "ghcr.io/$OWNER/routecraft.dev:latest"
          docker tag "ghcr.io/$OWNER/routecraft.dev:latest" routecraft-site:rescan

      # Each scan records its verdict instead of stopping the job, so one
      # failure does not hide the others.
      - name: Scan
        id: scan
        run: |
          set -uo pipefail
          FAILED=""
          ERRORED=""
          mkdir -p "$RUNNER_TEMP/reports" "$RUNNER_TEMP/sarif"
          scan() {
            local label="$1"; shift
            local out="$RUNNER_TEMP/reports/$label.txt"
            # The step shell runs with -e, so an unguarded gate exit 3 ends the step.
            local rc=0
            .github/scripts/trivy.sh gate "$@" > "$out" 2>&1 || rc=$?
            .github/scripts/trivy.sh "$@" --quiet --ignorefile .trivyignore.yaml \
              --format sarif --output "/scan/sarif/$label.sarif" >> "$out" 2>&1 \
              && echo "sarif-$label=true" >> "$GITHUB_OUTPUT" || rc=2
            case "$rc" in
              0) echo "### $label: clean" >> "$GITHUB_STEP_SUMMARY" ;;
              3) FAILED="$FAILED $label"
                 echo "### $label: fixable HIGH or CRITICAL findings" >> "$GITHUB_STEP_SUMMARY" ;;
              *) ERRORED="$ERRORED $label"
                 echo "### $label: the scan itself failed" >> "$GITHUB_STEP_SUMMARY" ;;
            esac
            { echo; echo '```'; cat "$out"; echo '```'; echo; } >> "$GITHUB_STEP_SUMMARY"
          }
          scan starter-image image --scanners vuln,secret routecraft-starter:rescan
          scan adapters fs --scanners vuln /scan/ref-adapters/bun.lock
          scan site-image image --scanners vuln,secret routecraft-site:rescan
          [ -z "$FAILED" ] || echo "::warning title=Security rescan::Fixable HIGH or CRITICAL findings in:$FAILED"
          echo "errored=${ERRORED# }" >> "$GITHUB_OUTPUT"

      - name: Upload the scan reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rescan-reports
          path: ${{ runner.temp }}/reports

      # A category per target, so a clean scan of one never closes another's alerts.
      - name: Upload the starter image findings to code scanning
        if: always() && steps.scan.outputs.sarif-starter-image == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/starter-image.sarif
          category: trivy-rescan-starter-image

      - name: Upload the adapter dependency findings to code scanning
        if: always() && steps.scan.outputs.sarif-adapters == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/adapters.sarif
          category: trivy-rescan-adapters

      - name: Upload the site image findings to code scanning
        if: always() && steps.scan.outputs.sarif-site-image == 'true'
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sarif/site-image.sarif
          category: trivy-rescan-site-image

      - name: Fail when a scan could not run
        if: steps.scan.outputs.errored != ''
        env:
          ERRORED: ${{ steps.scan.outputs.errored }}
        run: |
          echo "::error title=Security rescan::The scan failed for: $ERRORED"
          exit 1
