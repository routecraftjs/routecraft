name: Release

# The single workflow that ships everything: npm publishes (stable releases
# via changesets AND canary snapshots) followed by the docs deploy, in that
# order, so a release is self-contained end to end. npm Trusted Publishing
# allows exactly ONE trusted publisher per package, pinned to one workflow
# filename, so every publish must originate from this file; ci.yml never
# touches the registry.
#
# Triggered by CI completing on a main push (not by the push itself), so
# nothing is ever published from a commit whose tests or smokes failed.
# workflow_dispatch redeploys the docs only (no npm publish).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      freeze_ref:
        description: >-
          Git ref to publish the released docs channel from. Defaults to the
          latest eligible v* tag. The escape hatch for fixing released docs
          without cutting a release: tag a corrected ref and dispatch with it.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Successful CI runs of real pushes only: never publish on a manual
    # dispatch or from a CI run that was itself manually dispatched.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Push the v* core tag and let the action create GitHub Releases.
      contents: write
      # Open/update the "Version Packages" PR.
      pull-requests: write
      # npm provenance attestation.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit the triggering CI run validated, not the branch
          # tip: main may have moved since, and that newer commit has its own
          # CI run and release run coming.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Auth is tokenless: npm Trusted Publishing (OIDC) is configured on
      # npmjs.com per package, pinned to this repo + this workflow file.
      # `changeset publish` shells out to npm publish, which picks it up via
      # the job's id-token permission. Requires npm >= 11.5 (Node 24 bundles
      # it; .nvmrc pins 24).
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run version-packages
          publish: bun run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The docs freeze in build-and-deploy-docs below keys off v* tags (core
      # version), while changesets tags per package
      # (@routecraft/routecraft@x.y.z). Mirror the core version as a v* tag
      # whenever core was part of a publish.
      - name: Push core version tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -eo pipefail
          CORE_VERSION=$(echo "$PUBLISHED" | jq -r '.[] | select(.name == "@routecraft/routecraft") | .version')
          if [ -n "$CORE_VERSION" ]; then
            git tag "v$CORE_VERSION"
            git push origin "v$CORE_VERSION"
            echo "Pushed tag v$CORE_VERSION"
          else
            echo "Core package was not published in this run; no v* tag."
          fi

  # Every main push that changed a public package ships a fresh canary of the
  # CHANGED packages (no changeset required: a synthetic one is generated by
  # scripts/prepare-canary-snapshot.mjs, which scopes the snapshot to the
  # push's diff while carrying over the bump intent of the pending changesets,
  # so canaries keep previewing the NEXT stable version). The fixed core train
  # moves together whenever any train member changed; independent packages
  # (ai, os) only get a canary when they themselves changed, versioned
  # from their OWN version line via snapshot.useCalculatedVersion
  # (e.g. 0.6.0-canary-<datetime>). One exception: an unchanged package whose
  # current version was never published is folded in anyway, so `changeset
  # publish` cannot leak a stable-looking version from this job.
  #
  # Serialized after the release job so a stable publish and its canary never
  # hit the registry concurrently.
  publish-canary:
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      # Download the push-base artifact from the (different) CI run.
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit the triggering CI run validated, not the branch
          # tip (see the release job).
          ref: ${{ github.event.workflow_run.head_sha }}
          # Full history: the snapshot step diffs against the pre-push commit
          # to find which packages changed.
          fetch-depth: 0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      # workflow_run events do not carry the push's `before` sha, so the CI
      # run records it as an artifact. Missing artifact falls back to HEAD~1
      # in the snapshot step below.
      - name: Download push base from the CI run
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: push-base
          path: /tmp/push-base
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Create snapshot changeset for changed packages
        id: snapshot
        run: |
          set -eo pipefail
          BASE=""
          if [ -f /tmp/push-base/push-base.txt ]; then
            BASE="$(cat /tmp/push-base/push-base.txt)"
          fi
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi
          # Scopes the snapshot to the packages this push changed (plus
          # fixed-group expansion and never-published versions), drops the
          # pending changesets so they cannot pull unchanged packages into
          # the canary, and carries their bump intent into the synthetic
          # changeset so canaries keep previewing the next stable version.
          node scripts/prepare-canary-snapshot.mjs "$BASE"

      - name: Install bun
        if: steps.snapshot.outputs.publish == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        if: steps.snapshot.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Version snapshot
        if: steps.snapshot.outputs.publish == 'true'
        env:
          # @changesets/changelog-github resolves PR and author links via the
          # GitHub API while versioning, snapshots included; without a token
          # it aborts the whole version step.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx changeset version --snapshot canary

      # Tokenless npm auth: same Trusted Publishing config as the release job
      # above; this is why the canary publish lives in this workflow file.
      - name: Publish snapshot to npm
        if: steps.snapshot.outputs.publish == 'true'
        run: |
          bun run build
          bunx changeset publish --tag canary --no-git-tag

  # Docs deploy as the LAST stage of the release flow: by the time this runs,
  # the release job has already pushed any fresh v* tag, so the freeze below
  # always sees the just-released version. No race, no double deploy, and the
  # docs never move when a release attempt failed. Docs-only pushes still
  # deploy on the main cadence because this workflow runs for every green
  # main push; workflow_dispatch covers manual redeploys.
  build-and-deploy-docs:
    needs: [release]
    # `!failure()` (rather than the default success()) lets the manual
    # dispatch path run while the release job is skipped.
    if: >-
      !failure() && !cancelled()
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      # One image build at a time: two runs pushing `latest` concurrently would
      # leave the moving tag on whichever finished last rather than on the
      # newest commit.
      group: docs-image
      cancel-in-progress: false
    permissions:
      contents: read
      # Push the site image to GHCR with the job's GITHUB_TOKEN.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The validated commit on workflow_run; manual dispatches (docs-only
          # redeploys) build from the main tip.
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          # Full history + tags so the freeze step below can read docs content
          # from the latest release tag.
          fetch-depth: 0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The published docs (/docs and /cheat-sheet) track the last released
      # version, never the in-development code on main. Their content is pinned
      # to the latest release tag (pushed by the release job above moments ago
      # when this push cut a release), leaving the rest of the site (home, blog,
      # changelog) on the main-branch cadence. This is what lets a blog post or
      # a home-page typo ship without cutting a release, without leaking
      # unreleased docs.
      #
      # Releases at or before MIN_FREEZE_VERSION predate the current docs styling
      # and do not render with the present shell, so they are never frozen or
      # published. Until a newer release exists, /docs publishes from the main
      # working tree (labelled with the in-development version).
      - name: Resolve docs release ref
        id: docver
        env:
          # Through the environment, never `${{ }}` inside the script: an
          # expression is expanded into the shell source before bash parses it,
          # so a dispatched value could close the quote and run commands on a
          # runner that holds deploy credentials.
          FREEZE_REF_INPUT: ${{ inputs.freeze_ref }}
        run: |
          set -eo pipefail
          git fetch --tags --force origin >/dev/null 2>&1 || true

          # Exclusive lower bound: only releases strictly newer than this render
          # with the current docs shell and are eligible to be frozen/published.
          MIN_FREEZE_VERSION="v0.5.0"

          # 0 (true) when $1 is strictly greater than $2 under version sort.
          version_gt() {
            [ "$1" != "$2" ] &&
              [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]
          }

          # An explicit ref from workflow_dispatch wins: it is how released
          # docs get fixed without waiting for the next npm release.
          OVERRIDE="$FREEZE_REF_INPUT"
          if [ -n "$OVERRIDE" ]; then
            # A ref name, and nothing that could be read as shell or forge an
            # extra key when written to GITHUB_OUTPUT.
            case "$OVERRIDE" in
              *[!A-Za-z0-9._/-]*)
                echo "freeze_ref may only contain A-Z a-z 0-9 . _ / and -" >&2
                exit 1
                ;;
            esac
            # A release tag, not any ref. The hatch exists to publish a
            # CORRECTED release, so pointing it at main or a branch would
            # publish unreleased docs as the released channel, and the verify
            # step could not tell (it compares the build against this same ref).
            case "$OVERRIDE" in
              v*) ;;
              *)
                echo "freeze_ref must be a v* release tag, not '$OVERRIDE'." >&2
                exit 1
                ;;
            esac
            # Namespaced AND peeled: the ref must be a tag, and the tag must
            # resolve to a commit, so a tag pointing at a tree or blob is
            # rejected here rather than failing mid-freeze at checkout.
            if ! git rev-parse --verify --quiet "refs/tags/$OVERRIDE^{commit}" >/dev/null; then
              echo "freeze_ref '$OVERRIDE' is not a tag resolving to a commit." >&2
              exit 1
            fi
            # The same styling floor the automatic path enforces.
            if ! version_gt "$OVERRIDE" "$MIN_FREEZE_VERSION"; then
              echo "freeze_ref '$OVERRIDE' is not newer than $MIN_FREEZE_VERSION." >&2
              exit 1
            fi
            echo "label=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "freeze_tag=$OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "Docs frozen to the dispatched ref: $OVERRIDE"
            exit 0
          fi

          # Only tags reachable from the checked-out ref: a v* tag on an
          # abandoned branch must never freeze the published docs.
          LATEST_TAG="$(git tag --merged HEAD -l 'v*' | sort -V | tail -n1)"
          if [ -n "$LATEST_TAG" ] && version_gt "$LATEST_TAG" "$MIN_FREEZE_VERSION"; then
            LABEL="$LATEST_TAG"
            FREEZE_TAG="$LATEST_TAG"
          else
            # No eligible release yet: publish the working-tree docs and label
            # them with the in-development core version. (The app package is
            # ignored by changesets, so its own version goes stale.)
            LABEL="v$(jq -r .version packages/routecraft/package.json)"
            FREEZE_TAG=""
          fi
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "freeze_tag=$FREEZE_TAG" >> "$GITHUB_OUTPUT"
          echo "Docs version label: $LABEL"
          echo "Freeze docs to tag: ${FREEZE_TAG:-<none, using working tree>}"

      # The script owns the pinned path list, the next-channel snapshot it takes
      # from main on the way through, and the conversion of tags cut before the
      # content root moved. It is the same command a developer runs to reproduce
      # this build locally, so the release and the local check cannot drift.
      - name: Freeze docs and cheat-sheet to the released ref
        if: steps.docver.outputs.freeze_tag != ''
        env:
          FREEZE_TAG: ${{ steps.docver.outputs.freeze_tag }}
        run: bun apps/routecraft.dev/scripts/freeze-docs.ts "$FREEZE_TAG"

      # Built here as well as in the image because the verify gate below reads
      # the prerender output, and a gate that runs after the push would be
      # reporting on an image that already shipped.
      - name: Build docs
        env:
          VITE_DOC_VERSION: ${{ steps.docver.outputs.label }}
        run: bun run --filter routecraft.dev build

      # The invariant this whole job exists to uphold, asserted against the
      # artifact rather than trusted. Every version-pinning bug here has been a
      # drift between what the freeze was believed to do and what got published.
      - name: Verify the published docs match the released ref
        env:
          FREEZE_TAG: ${{ steps.docver.outputs.freeze_tag }}
        run: bun apps/routecraft.dev/scripts/verify-docs-freeze.ts "$FREEZE_TAG"

      # Both channels multiply every mistake, and a moved page is easy to ship
      # and hard to notice, so this runs against the artifact too.
      - name: Check internal links
        env:
          FREEZE_TAG: ${{ steps.docver.outputs.freeze_tag }}
        run: bun apps/routecraft.dev/scripts/check-links.ts --freeze-tag "$FREEZE_TAG"

      - name: Log in to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # The image is the rollback unit: every deploy is a pull of an immutable
      # <docs-version>-<short-sha> tag, so rolling back is redeploying the
      # previous one. `latest` is the moving tag Dokploy is configured to pull.
      - name: Build and push the site image
        id: image
        env:
          DOC_VERSION: ${{ steps.docver.outputs.label }}
          POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: |
          set -eo pipefail
          # A registry tag admits [A-Za-z0-9_.-] only, and a git tag name may
          # legally carry a slash, which a registry reads as a path segment.
          VERSION="$(printf '%s' "$DOC_VERSION" | tr -c 'A-Za-z0-9_.-' '-')"
          # The commit this job actually built, not github.sha: on workflow_run
          # that expression can point at a newer main tip.
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/$OWNER/routecraft.dev"

          # The build context is the repository root: the site is a workspace
          # member and the lockfile lives there. It carries the frozen tree and
          # the marker the freeze left, which is what keeps the image build from
          # regenerating the next channel out of the released docs.
          #
          # VITE_BASE_URL is left to the Dockerfile default, the production
          # origin, so the image's canonicals and social cards are the deployed
          # ones.
          docker build \
            --file apps/routecraft.dev/Dockerfile \
            --build-arg VITE_DOC_VERSION="$DOC_VERSION" \
            --build-arg VITE_POSTHOG_KEY="$POSTHOG_KEY" \
            --build-arg VITE_POSTHOG_HOST="$POSTHOG_HOST" \
            --tag "$IMAGE:$VERSION-$SHORT_SHA" \
            --tag "$IMAGE:latest" \
            .

          docker push "$IMAGE:$VERSION-$SHORT_SHA"
          docker push "$IMAGE:latest"
          echo "reference=$IMAGE:$VERSION-$SHORT_SHA" >> "$GITHUB_OUTPUT"

      # MAINTAINER SETUP: deploying is Dokploy pulling the tag pushed above. Its
      # webhook URL is per-application and issued by the Dokploy instance, so it
      # cannot live in this repository; add it as the DOKPLOY_DEPLOY_WEBHOOK
      # repository secret. Until it is set this step is a no-op and the site
      # keeps serving the previous image, which is why an unset secret is
      # reported rather than failed.
      - name: Trigger the Dokploy deployment
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          set -eo pipefail
          if [ -z "$DOKPLOY_DEPLOY_WEBHOOK" ]; then
            # A green release must not read as "the site is live". The run is
            # annotated and summarised so the published-but-not-deployed state
            # is visible without opening the log.
            echo "::warning title=Image published, not deployed::DOKPLOY_DEPLOY_WEBHOOK is not set, so $IMAGE_REFERENCE was pushed but the live site still serves the previous release."
            {
              echo "### Docs image published without deploying"
              echo
              echo "\`$IMAGE_REFERENCE\` is in the registry. \`DOKPLOY_DEPLOY_WEBHOOK\` is not set,"
              echo "so nothing was asked to deploy it and the live site is unchanged."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DOKPLOY_DEPLOY_WEBHOOK" >/dev/null
          echo "Dokploy asked to deploy $IMAGE_REFERENCE."
          echo "Deployment requested for \`$IMAGE_REFERENCE\`." >> "$GITHUB_STEP_SUMMARY"
