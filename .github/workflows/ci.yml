name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".cursor/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/README.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".cursor/**"

permissions:
  contents: read

concurrency:
  # Include event_name so the new pull_request-triggered run doesn't collide
  # with main's still-live pull_request_target workflow during the transition.
  # After this PR merges, only pull_request fires, so the event_name segment
  # becomes a no-op and concurrency works as before.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.packages }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
              - 'examples/**'
              - 'bun.lock'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - '.github/scripts/**'
              - '.changeset/**'
            # The site renders the reference catalogues from the packages, so a
            # package change can break a docs page without touching the app.
            docs:
              - 'apps/routecraft.dev/**'
              - 'packages/**'
              - 'bun.lock'
              - '.github/workflows/**'

      # release.yml runs on workflow_run, where the push's `before` sha is not
      # in the event payload; hand it over as an artifact so the canary job
      # can diff the exact range of the push.
      - name: Record push base for the release workflow
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: echo "$BEFORE" > push-base.txt

      - name: Upload push base
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: push-base
          path: push-base.txt
          retention-days: 1

  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The package cache, not node_modules. Several dependencies ship a nested
      # node_modules inside their own dist or test fixtures: nitro vendors defu
      # under dist/node_modules, and its vite entry imports it without declaring
      # it, so nothing else can supply it. Archiving `**/node_modules` matches
      # those nested trees separately from the tree containing them, and the
      # restore came back missing them, which failed the site build and nothing
      # else. Installing from a warm package cache takes seconds and always
      # produces a correct tree.
      - name: Cache the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

  validate:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Restore the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: |
          bun run format
          bun run typecheck
          bun run lint
          bunx madge --circular .

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Restore the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  build:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Restore the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build
        env:
          # PostHog keys are NEXT_PUBLIC_* so technically safe to expose, but
          # the PR build artifact is thrown away. Only inject on trusted triggers.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ github.event_name != 'pull_request' && secrets.NEXT_PUBLIC_POSTHOG_KEY || '' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ github.event_name != 'pull_request' && secrets.NEXT_PUBLIC_POSTHOG_HOST || '' }}

      - name: Check bundle size
        run: bun run limit:size

      # Artifacts, not actions/cache: the cache service is eventually
      # consistent, so a same-run consumer job can miss a key saved seconds
      # earlier (observed: smoke jobs packing an empty dist). Artifacts are
      # guaranteed within the run that produced them.
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-dist
          path: |
            packages/*/dist
            examples/dist
          if-no-files-found: error
          retention-days: 1

  # The site is the only workspace whose own checks were never gated: the root
  # typecheck does not cover it, and the acceptance suite that guards the URL
  # space, anchors and metadata ran only by hand. A broken app typecheck and a
  # metadata regression both reached main under a green build because of it.
  docs-site:
    needs: [changes, setup]
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Restore the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the site's types and lint
        working-directory: apps/routecraft.dev
        run: |
          bun run typecheck
          bun run lint

      # The fenced TypeScript in the docs is prose to every other check here,
      # so an example naming an option that does not exist ships unnoticed.
      # This compiles them against the workspace packages. It runs before the
      # site build because it needs neither the build nor the browser, so a
      # broken example fails in about fifteen seconds rather than after them.
      - name: Check the documentation's code examples
        working-directory: apps/routecraft.dev
        run: bun run check:examples

      - name: Restore the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Chromium only: the suite runs one project, and pulling the other engines
      # would cost more than every other step in this job put together.
      - name: Install the Playwright browser
        working-directory: apps/routecraft.dev
        run: bunx playwright install --with-deps chromium

      # The origin is the host the suite serves from, so the absolute URLs the
      # build emits agree with it rather than naming production.
      - name: Build the site
        working-directory: apps/routecraft.dev
        env:
          VITE_BASE_URL: http://localhost:3000
        run: bun run build

      - name: Check internal links
        run: bun apps/routecraft.dev/scripts/check-links.ts

      # Playwright starts and stops the built server itself; see the webServer
      # block in playwright.config.ts.
      - name: Run the acceptance suite
        working-directory: apps/routecraft.dev
        run: bun run test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/routecraft.dev/playwright-report
          retention-days: 7

  scaffolder-smoke:
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    name: scaffolder-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Restore the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-dist

      - name: Run scaffolder integration tests (bun)
        env:
          TEST_PACKAGE_MANAGER: bun
        run: bun run test:integration

      - name: Run scaffolder integration tests (npm, install + typecheck only)
        env:
          TEST_PACKAGE_MANAGER: npm
        run: bun run test:integration

  embedding-smoke:
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    name: embedding-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # No bun and no workspace node_modules: the smoke deliberately uses only
      # node + npm so it matches a real Node user embedding the tarball.
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-dist

      - name: Smoke test Node embedding (pack + npm install + node runner.ts)
        run: node .github/scripts/smoke-test-embedding.mjs

  # The isolation tier is a security guarantee, and this is the only place
  # it is exercised against a real kernel. It runs as its own job so a
  # failure reads as "isolation broke" rather than being buried in a job
  # named for something else.
  isolation-smoke:
    needs: [changes, validate, test]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    name: isolation-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Restore the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # so the runner creates the namespace and then refuses the uid mapping
      # ("write failed /proc/self/uid_map: Operation not permitted"). That is
      # exactly the case OS1001 tells an operator to resolve by granting the
      # privilege, so the job grants it rather than reporting that the tier's
      # guarantees could not be proven. Guarded, because the knob only exists
      # on kernels that carry the restriction.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # Fail here rather than let the suite report green on a runner that
      # cannot create namespaces: a skipped isolation test is a guarantee
      # nobody checked. The flags match the tier's own set exactly, including
      # --kill-child, so the probe cannot pass on a util-linux whose flags the
      # tier then fails on.
      - name: Check the runner can create namespaces
        run: |
          if ! unshare --user --map-current-user --mount --pid --fork --mount-proc --kill-child --net -- true; then
            echo "::error::This runner cannot create the namespaces the unshare tier needs."
            echo "::error::None of the tier's guarantees can be proven here, so the suite is failed rather than skipped."
            exit 1
          fi

      # The docker tier's smoke runs in the same job for the same reason the
      # unshare one does: a guarantee nobody checked must not look checked.
      # The runner ships a daemon; the probe fails loudly if it is absent,
      # and the image is pulled here because the tier never pulls one.
      - name: Check the runner has a Docker daemon
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "::error::This runner has no reachable Docker daemon, so the docker tier's guarantees cannot be proven here."
            echo "::error::The suite is failed rather than skipped."
            exit 1
          fi
          docker pull alpine:3.20

      - name: Run the isolation smoke
        run: bun run test:isolation

  adapter-cross-runtime:
    needs: [changes, validate, test, build]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    name: adapter-cross-runtime (${{ matrix.runtime }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # Installed in both matrix legs: the dependency-install fallback below
      # needs bun even on the node leg. The node tests themselves still run
      # under plain node via npm.
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: "package.json"

      - name: Restore the bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-dist

      - name: Run cross-runtime adapter tests (bun)
        if: matrix.runtime == 'bun'
        run: bun run test:cross-runtime

      - name: Run cross-runtime adapter tests (node)
        if: matrix.runtime == 'node'
        run: npm run test:cross-runtime:node
