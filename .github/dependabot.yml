version: 2
updates:
  - package-ecosystem: "github-actions"
    # The composite actions pin actions too, and "/" alone scans only
    # .github/workflows.
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
    # Longer than GitHub's default: a hijacked action release is usually
    # caught within days. These PRs also need a human approval to merge.
    cooldown:
      default-days: 7
    # One grouped PR at a time; it is refreshed in place until merged.
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # changesets/action v2 requires Changesets CLI v3; this repo runs CLI
      # v2. Lift this when the CLI is migrated to v3.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    groups:
      # CodeQL fails analyze when init and analyze run different versions,
      # so its actions must move in one PR.
      actions:
        patterns:
          - "*"
      # The PR limit does not cap security updates, so bundle those too.
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      semver-minor-days: 14
      semver-patch-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Held with the bun runtime: react-dom 19.3's server build fails to load
      # on bun 1.3.11, so every prerendered page 500s, and no later bun passes
      # the suite yet. The site's `~19.2` ranges and the root `overrides.react`
      # hold it for every workspace install and keep one React in the tree;
      # lift them with the `packageManager` bump.
      - dependency-name: "react"
        versions: [">=19.3.0"]
      - dependency-name: "react-dom"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.3.0"]
      # @opentelemetry/sdk-trace-base 2.x declares peer api <1.10.0; api 1.10
      # installs a second copy and tracing silently becomes a no-op. Lift this
      # when sdk-trace-base widens its peer range.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      # 0.7 buffers responses by locking and releasing the body reader, which
      # bun treats as consumed, so every request throws "Body already used".
      # Lift this when the SDK or bun fixes it.
      - dependency-name: "@typesafe-ai/sdk"
        versions: [">=0.7.0"]
    groups:
      dependencies:
        patterns:
          - "*"
      dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"
