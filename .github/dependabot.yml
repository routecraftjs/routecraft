version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # changesets/action v2 requires Changesets CLI v3; this repo runs CLI
      # v2. Lift this when the CLI is migrated to v3.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      semver-minor-days: 14
      semver-patch-days: 7
    ignore:
      # agent-browser dropped its JavaScript library in 0.20.0 (the package is a
      # Rust binary since); the agentBrowser adapter imports dist/browser.js and
      # dist/actions.js. Lift this once the adapter drives the CLI or daemon.
      - dependency-name: "agent-browser"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Held with the bun runtime: react-dom 19.3's server build fails to load
      # on bun 1.3.11, so every prerendered page 500s, and no later bun passes
      # the suite yet. The site's `~19.2` ranges and the root `overrides.react`
      # hold it for every workspace install and keep one React in the tree;
      # lift them with the `packageManager` bump.
      - dependency-name: "react"
        versions: [">=19.3.0"]
      - dependency-name: "react-dom"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react"
        versions: [">=19.3.0"]
      - dependency-name: "@types/react-dom"
        versions: [">=19.3.0"]
    groups:
      dependencies:
        patterns:
          - "*"
