version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # changesets/action v2 requires Changesets CLI v3; this repo runs CLI
      # v2. Lift this when the CLI is migrated to v3.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    cooldown:
      semver-minor-days: 14
      semver-patch-days: 7
    ignore:
      # agent-browser dropped its JavaScript library in 0.20.0 (the package is a
      # Rust binary since); the agentBrowser adapter imports dist/browser.js and
      # dist/actions.js. Lift this once the adapter drives the CLI or daemon.
      - dependency-name: "agent-browser"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
